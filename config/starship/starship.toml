"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](11)\
$os\
[](bg:9 fg:11)\
$directory\
[](fg:9 bg:8)\
$git_branch\
$git_status\
[](fg:8 bg:0)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:0 bg:8)\
$time\
[ ](fg:8)\
\n$character"""

[directory]
style = "fg:0 bg:9"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:8"
format = '[[ $symbol $branch ](fg:11 bg:8)]($style)'

[git_status]
style = "bg:8"
format = '[[($all_status$ahead_behind )](fg:11 bg:8)]($style)'

[nodejs]
symbol = ""
style = "bg:0"
format = '[[ $symbol ($version) ](fg:9 bg:0)]($style)'

[bun]
symbol = ""
style = "bg:0"
format = '[[ $symbol ($version) ](fg:9 bg:0)]($style)'

[rust]
symbol = ""
style = "bg:0"
format = '[[ $symbol ($version) ](fg:9 bg:0)]($style)'

[golang]
symbol = ""
style = "bg:0"
format = '[[ $symbol ($version) ](fg:9 bg:0)]($style)'

[php]
symbol = ""
style = "bg:0"
format = '[[ $symbol ($version) ](fg:9 bg:0)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:8"
format = '[[  $time ](fg:15 bg:8)]($style)'

[os]
style = "bg:11 fg:0"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
NixOS = ""     # Symbol NixOS
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
